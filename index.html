<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국내 주식 수급 분석</title><style>body{margin:0;background:#0b1220;color:#f3f5fc;font:16px system-ui,sans-serif}main{max-width:780px;margin:auto;padding:24px}section{background:#1b2942;border-radius:16px;padding:20px;margin:16px 0}button{background:#58a6ff;border:0;color:#071427;font-weight:bold;padding:15px 22px;border-radius:10px;font-size:17px}button:disabled{opacity:.45}small{color:#b5c3da}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid #354560;text-align:right}th:first-child,td:first-child{text-align:left}.scroll{overflow-x:auto}.warning{color:#ffcc85}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}</style></head><body><main><h1>국내 주식 외국인·기관 수급</h1><section><button id="run">▶ 수급 분석 시작</button><p id="status">상태 확인 중...</p><small>비공식 pykrx 데이터 수집을 서버에서 시도합니다. 최초 실행은 시간이 걸릴 수 있습니다. 무료 서버에서는 재시작 시 결과가 사라질 수 있습니다.</small></section><section><h2>수집 결과</h2><div id="meta">아직 결과 없음</div><p class="warning">검증된 데이터가 없으면 종목을 추천하지 않습니다. 현재 점수는 수급 전용 시험 점수입니다.</p><div class="scroll"><table><thead><tr><th>종목</th><th>코드</th><th>외국인 20일(억원)</th><th>기관 20일(억원)</th><th>시험점수</th></tr></thead><tbody id="rows"><tr><td colspan="5">분석을 실행하세요.</td></tr></tbody></table></div></section><section><h2>오류·진단</h2><pre id="error">없음</pre></section></main><script>const $=id=>document.getElementById(id);let running=false;async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();running=s.running;$('run').disabled=running;$('run').textContent=running?'⏳ 수집 중...':'▶ 수급 분석 시작';const x=s.report||{};$('status').textContent=`상태: ${running?'RUNNING':x.status||'NOT_RUN'} / 마지막 실행: ${s.last_started||'없음'}`;$('meta').textContent=`기준일: ${x.requested_date||'미확인'} | 전체 대상: ${x.universe_count||0} | 조회 시도: ${x.attempted||0} | 검증: ${x.verified||0}`;const rows=x.rows||[];$('rows').replaceChildren();if(!rows.length){let tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='검증된 데이터가 없습니다.';tr.append(td);$('rows').append(tr)}for(const v of rows.slice(0,20)){const tr=document.createElement('tr');const w=v.windows?.['20']||{};for(const val of [v.name,v.ticker,Number(w.foreign_krw||0)/1e8,Number(w.institution_krw||0)/1e8,v.score_flow_only_100]){let td=document.createElement('td');td.textContent=typeof val==='number'?val.toFixed(2):val;tr.append(td)}$('rows').append(tr)}$('error').textContent=[s.last_error,...(x.failures||[]).slice(0,8).map(f=>`${f.ticker||f.stage}: ${f.reason}`)].filter(Boolean).join('\n')||'없음'}catch(e){$('status').textContent='서버 연결 오류: '+e.message}}$('run').onclick=async()=>{if(!confirm('실제 수급 데이터 수집을 시작할까요?'))return;try{const r=await fetch('/api/run',{method:'POST'});const d=await r.json();if(!r.ok)alert(d.error||'실행 실패');await refresh()}catch(e){alert('실행 요청 실패: '+e.message)}};refresh();setInterval(refresh,4000);</script></body></html>
